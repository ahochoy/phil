[project]
name = "phil"
version = "0.1.0"
description = "Contract-driven CLI coding agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.19",
    "langchain>=1.4.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "langgraph-checkpoint>=4.2.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
    # 2.13+ is Python 3.14-clean (2.12 warns on import); the newest openrouter SDK still caps
    # pydantic <2.13, so this holds openrouter at 0.10.x until it lifts the cap.
    "pydantic>=2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "prompt-toolkit>=3.0.53",
    "langchain-openai>=1.6.7",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "keyring>=25.7.0",
]

[project.scripts]
phil = "phil.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real LLM APIs (opt-in with -m live)",
    "bench: runs the live benchmark (opt-in with -m bench)",
]
addopts = "-m 'not live and not bench' -n auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
