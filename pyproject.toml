[project]
name = "phil"
version = "0.1.0"
description = "Contract-driven CLI coding agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.5.6",
    "langchain>=1.2.17",
    "langchain-openrouter>=0.2.3",
    "langgraph>=1.1.10",
    "langgraph-checkpoint>=4.0.3",
    "rich>=15.0.0",
    "typer",
    "pydantic",
    "langgraph-checkpoint-sqlite>=3.0.3",
]

[project.scripts]
phil = "phil.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real LLM APIs (opt-in with -m live)"]
addopts = "-m 'not live' -n auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
