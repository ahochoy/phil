[project]
name = "phil-agent"
version = "0.1.0"
description = "A terminal coding agent that plans with you, works in its own git worktree, and stops at the budget you set"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrew HoChoy" }]
keywords = ["coding agent", "llm", "cli", "langgraph", "ai agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.19",
    "langchain>=1.4.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "langgraph-checkpoint>=4.2.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
    # 2.13+ is Python 3.14-clean (2.12 warns on import); the newest openrouter SDK still caps
    # pydantic <2.13, so this holds openrouter at 0.10.x until it lifts the cap.
    "pydantic>=2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "prompt-toolkit>=3.0.53",
    "langchain-openai>=1.6.7",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "keyring>=25.7.0",
    "tomlkit>=0.15.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
]

[project.scripts]
phil = "phil.cli.main:app"

[project.urls]
Homepage = "https://github.com/ahochoy/phil"
Documentation = "https://github.com/ahochoy/phil/blob/main/docs/guide.md"
Repository = "https://github.com/ahochoy/phil"
Issues = "https://github.com/ahochoy/phil/issues"
Changelog = "https://github.com/ahochoy/phil/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phil"]

# Only what rebuilds and tests the package: the site, docs, prototype and assets stay out.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real LLM APIs (opt-in with -m live)",
    "bench: runs the live benchmark (opt-in with -m bench)",
]
addopts = "-m 'not live and not bench' -n auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
