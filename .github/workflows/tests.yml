name: tests

# Phil's offline test suite on every pull request and every push to main. Live and bench tests
# (real model calls) stay opt-in, so this needs no secrets, and fork PRs can't reach any.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runs the suite about five times slower (process start-up through Git Bash).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    # Windows is being ported: its failures are reported but don't fail the run until it passes.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      # The tests create throwaway git repositories and commit to them.
      - name: Configure git
        run: |
          git config --global user.name "Phil CI"
          git config --global user.email "ci@phil.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Install
        run: uv sync --locked

      # --durations lists the slowest tests; faulthandler_timeout dumps every thread's stack
      # if one test runs over 5 minutes, so a hang shows where it is instead of eating the job.
      - name: Test
        run: uv run pytest -q --durations=25 -o faulthandler_timeout=300
