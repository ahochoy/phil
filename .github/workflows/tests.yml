name: tests

# Phil's offline test suite on every pull request and every push to main. Live and bench tests
# (real model calls) stay opt-in, so this needs no secrets, and fork PRs can't reach any.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runs the suite a few times slower (process start-up through Git Bash).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      # The tests create throwaway git repositories and commit to them.
      - name: Configure git
        run: |
          git config --global user.name "Phil CI"
          git config --global user.email "ci@phil.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      # The suite starts thousands of short processes and writes many small files; Defender scanning
      # each one is a large share of the Windows time. The runner is throwaway, and the job reads no
      # secrets, so turning real-time scanning off for it costs nothing.
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install
        run: uv sync --locked

      # --durations lists the slowest tests; faulthandler_timeout dumps every thread's stack
      # if one test runs over 5 minutes, so a hang shows where it is instead of eating the job.
      # PHIL_LOCKTRACE traces SQLite statements, so a "database is locked" failure says which
      # connection held the lock (tests/support/locktrace.py).
      - name: Test
        env:
          PHIL_LOCKTRACE: "1"
        run: uv run pytest -q --durations=25 -o faulthandler_timeout=300
